<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử thanh toán</title>
    <link rel="stylesheet" href="./assets/css/ThongBaoStyle.css" />
  </head>
  <body>
    <header>
      <div class="back-button">
        <button onclick="goBack()">Quay lại</button>
      </div>
      <h1>Thông Báo</h1>
    </header>

    <div class="container">
      <!-- Thanh tìm kiếm -->
      <div class="search-view">
        <div class="search-container">
          <img src="./assets/imgs/icons/ic-search-gray.svg" alt="Search Icon" />
          <input type="text" id="searchInput" placeholder="Tìm kiếm" />
        </div>
        <div class="search-actions">
          <img src="./assets/imgs/icons/ic-sort.svg" alt="Sort Icon" />
          <img src="./assets/imgs/icons/ic-fill.svg" alt="Fill Icon" />
        </div>
      </div>

      <!-- Hiển thị danh sách thông báo -->
      <div id="thongBaoList" class="thongBaoContainer"></div>

      <div id="itemDetailModal" class="modal">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <h3>Chi Tiết</h3>
          <div id="itemDetailContent"></div>
        </div>
      </div>
    </div>

    <!-- Đính kèm file JavaScript -->
    <script src="./assets/js/ThongBao.js" type="module"></script>
  </body>
</html>
